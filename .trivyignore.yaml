# Exceptions to the CVE gate (`just audit`, ci.yml `dependency-audit`,
# image scans). The gate fails on HIGH/CRITICAL findings that have a fix.
#
# Only add an entry when the finding is verified non-exploitable here or the
# fix cannot be taken yet. Every entry needs a `statement` explaining why and
# an `expired_at` date so it is re-reviewed; expired entries stop applying.
#
# Format: https://trivy.dev/latest/docs/configuration/filtering/#trivyignoreyaml
#
# vulnerabilities:
#   - id: CVE-0000-00000
#     paths:
#       - "web-frontend/yarn.lock"
#     statement: "Dev-only build tool; never shipped in the prod image."
#     expired_at: 2026-12-31

vulnerabilities:
  - id: CVE-2026-102826
    paths:
      - "web-frontend/yarn.lock"
    statement: "Dev-only: pulled in solely by @nuxt/devtools (dev server, never in the prod image), which runs fixed git commands (branch, revparse --short HEAD, status) on the project root; the bypasses need attacker-controlled git arguments or config. simple-git 4 drops the default export devtools 3.x imports, so a resolution breaks `nuxt dev`; drop this once @nuxt/devtools ships without simple-git 3."
    expired_at: 2026-12-31
