{{- /*
Runtime web-frontend branding (docs/installation/branding.md). Rendered from the
inline branding values unless branding.existingClaim supplies the directory;
always rendered when faviconBase64 is set, for the /favicon.ico mount.
*/ -}}
{{- $b := .Values.branding }}
{{- $inline := and (include "baserow.branding.inline" .) (not $b.existingClaim) }}
{{- if or $inline $b.faviconBase64 }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "baserow.fullname" . }}-branding
  labels:
    {{- include "baserow.labels" . | nindent 4 }}
{{- if $inline }}
data:
  branding.json: {{ dict "appName" $b.appName "colors" $b.colors "fontFamily" $b.fontFamily "messages" $b.messages "siteUrl" $b.siteUrl "docsUrl" $b.docsUrl "siteTitle" $b.siteTitle "showAttribution" $b.showAttribution | toJson | quote }}
  {{- if $b.themeCss }}
  theme.css: {{ $b.themeCss | quote }}
  {{- end }}
{{- end }}
{{- if or (and $inline $b.files) $b.faviconBase64 }}
binaryData:
  {{- if $inline }}
  {{- /* ConfigMap keys cannot contain "/": the deployment maps them back. */}}
  {{- range $path, $content := $b.files }}
  {{ $path | replace "/" "__" }}: {{ $content | quote }}
  {{- end }}
  {{- end }}
  {{- with $b.faviconBase64 }}
  favicon.ico: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}
