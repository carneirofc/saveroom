apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "baserow.fullname" . }}-celery-beat
  labels:
    {{- include "baserow.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery-beat
spec:
  # Beat must be a singleton to avoid duplicate scheduled tasks.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "baserow.componentSelectorLabels" (dict "root" . "component" "celery-beat") | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "baserow.podAnnotations" . | nindent 8 }}
      labels:
        {{- include "baserow.componentSelectorLabels" (dict "root" . "component" "celery-beat") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "baserow.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: celery-beat
          image: {{ include "baserow.image.backend" . }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          args: ["celery-beat"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          envFrom:
            {{- include "baserow.envFrom" . | nindent 12 }}
          env:
            {{- include "baserow.secretEnv" . | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - /baserow/backend/docker/docker-entrypoint.sh
                - celery-beat-healthcheck
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.celeryBeat | nindent 12 }}
          volumeMounts:
            {{- include "baserow.tmpVolumeMounts" . | nindent 12 }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- include "baserow.tmpVolumes" . | nindent 8 }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
