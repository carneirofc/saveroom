{{- if .Values.ingress.enabled }}
{{- $fullname := include "baserow.fullname" . }}
{{- $labels := include "baserow.labels" . }}
{{- $backendPaths := .Values.ingress.backendPaths }}
{{- $ing := .Values.ingress }}
{{- if eq $ing.mode "albGroup" }}
{{- /*
  Two Ingress objects joined onto one load balancer through the AWS Load Balancer
  Controller's IngressGroup feature. The split exists so each target group gets its
  own health check: the controller resolves healthcheck-path per Ingress, so a single
  Ingress would force the web-frontend to answer the backend's probe (or vice versa).
  group.order puts the backend path rules ahead of the web-frontend catch-all.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-backend
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    {{- include "baserow.albGroupIngressAnnotations" (dict "root" $ "component" "backend") | nindent 4 }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ing.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $ing.host | quote }}
      http:
        paths:
          {{- range $backendPaths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-backend
                port:
                  number: 8000
          {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-web-frontend
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: web-frontend
  annotations:
    {{- include "baserow.albGroupIngressAnnotations" (dict "root" $ "component" "webFrontend") | nindent 4 }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ing.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $ing.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-web-frontend
                port:
                  number: 3000
{{- else }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- $labels | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ing.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $ing.host | quote }}
      http:
        paths:
          {{- range $backendPaths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-backend
                port:
                  number: 8000
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-web-frontend
                port:
                  number: 3000
{{- end }}
{{- end }}
