{{- if not .Values.secrets.existingSecret }}
{{- $name := include "baserow.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- /* SECRET_KEY: use provided, else preserve existing, else generate */}}
{{- $secretKey := .Values.secrets.secretKey }}
{{- if not $secretKey }}
  {{- if and $existing (hasKey (default dict $existing.data) "secret-key") }}
    {{- $secretKey = index $existing.data "secret-key" | b64dec }}
  {{- else }}
    {{- $secretKey = randAlphaNum 50 }}
  {{- end }}
{{- end }}
{{- /* JWT signing key */}}
{{- $jwtKey := .Values.secrets.jwtSigningKey }}
{{- if not $jwtKey }}
  {{- if and $existing (hasKey (default dict $existing.data) "jwt-signing-key") }}
    {{- $jwtKey = index $existing.data "jwt-signing-key" | b64dec }}
  {{- else }}
    {{- $jwtKey = randAlphaNum 50 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "baserow.labels" . | nindent 4 }}
type: Opaque
data:
  secret-key: {{ $secretKey | b64enc | quote }}
  jwt-signing-key: {{ $jwtKey | b64enc | quote }}
  {{- /* DATABASE_PASSWORD only when using an external DB without its own secret */}}
  {{- if and (not .Values.postgresql.enabled) (not .Values.externalDatabase.existingSecret) }}
  database-password: {{ .Values.externalDatabase.password | default "" | b64enc | quote }}
  {{- end }}
  {{- /* REDIS_PASSWORD only when using an external Redis without its own secret */}}
  {{- if and (not .Values.redis.enabled) (not .Values.externalRedis.existingSecret) }}
  redis-password: {{ .Values.externalRedis.password | default "" | b64enc | quote }}
  {{- end }}
  {{- /* S3 credentials only in the staticKeys auth mode, and only when object
         storage does not reference a secret of its own. The irsa/podIdentity modes
         deliberately store nothing here. */}}
  {{- if and (include "baserow.objectStorage.useStaticKeys" .) (not .Values.objectStorage.existingSecret) }}
  s3-access-key-id: {{ .Values.objectStorage.accessKeyId | default "" | b64enc | quote }}
  s3-secret-access-key: {{ .Values.objectStorage.secretAccessKey | default "" | b64enc | quote }}
  {{- end }}
{{- end }}
