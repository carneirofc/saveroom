{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "baserow.serviceAccountName" . }}
  labels:
    {{- include "baserow.labels" . | nindent 4 }}
  {{- with (include "baserow.serviceAccountAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
