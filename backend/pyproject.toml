[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baserow"
authors = [{ name = "carneirofc", email = "claudiofcarneiro@gmail.com" }]
description = """Baserow is an open source no-code database tool and Airtable \
                    alternative. Easily create a relational database without any \
                    technical expertise. Build a table and define custom fields \
                    like text, number, file and many more."""
license = { file = "../LICENSE" }
requires-python = "==3.14.*"
dynamic = ["version"]
classifiers = []

dependencies = [
    "django==5.2.17",
    "django-cors-headers==4.9.0",
    # Held: 3.18 returns list-field validation errors as index-keyed dicts
    # instead of lists, changing the API error shape the frontend relies on.
    # Blocks Django 6.1 too; see #23.
    "djangorestframework==3.17.2",
    "djangorestframework-simplejwt==5.5.1",
    "psycopg2-binary==2.9.13",
    "Faker==40.40.0",
    "gunicorn==26.2.0",
    "uvicorn[standard]==0.54.0",
    # gunicorn worker class for the ASGI server (moved out of uvicorn core).
    "uvicorn-worker==0.4.0",
    "websockets==17.2",
    "requests==2.34.2",
    "itsdangerous==2.2.0",
    "Pillow==12.3.0",
    "drf-spectacular==0.30.0",
    "asgiref==3.12.1",
    "channels[daphne]==4.3.2",
    "channels-redis==4.3.0",
    "celery[redis]==5.6.3",
    # Held with redis below: django-redis 7 / redis-py 8 are incompatible with
    # celery 5.6's kombu (caps redis-py < 6.5). See #27.
    "django-redis==6.0.0",
    "django-celery-email-reboot==4.2.1",
    "zipp==4.1.1",
    "unicodecsv==0.14.1",
    "django-celery-beat==2.9.0",
    "celery-redbeat==2.4.2",
    "flower==2.2.0",
    "service-identity==26.1.0",
    "regex==2026.9.29",
    # Held: must match the ANTLR version the checked-in formula parser was
    # generated with (web-frontend pins antlr4 4.9.3 for the same reason).
    "antlr4-python3-runtime==4.9.3",
    "tqdm==4.70.1",
    "boto3==1.43.108",
    "django-storages==1.14.6",
    "django-storages[azure]==1.14.6",
    "django-storages[google]==1.14.6",
    # Held: 4.x drops the plugin_dir/contrib-app API core/apps.py builds on (#25).
    "django-health-check==3.20.8",
    "psutil==7.2.2",
    "dj-database-url==3.1.2",
    "redis==6.4.0",
    "pysaml2==7.5.5",
    "validators==0.35.0",
    "requests-oauthlib==2.0.0",
    "opentelemetry-api==1.45.0",
    "opentelemetry-exporter-otlp-proto-http==1.45.0",
    "opentelemetry-instrumentation==0.66b0",
    "opentelemetry-instrumentation-django==0.66b0",
    "opentelemetry-instrumentation-aiohttp-client==0.66b0",
    "opentelemetry-instrumentation-asgi==0.66b0",
    "opentelemetry-instrumentation-botocore==0.66b0",
    "opentelemetry-instrumentation-celery==0.66b0",
    "opentelemetry-instrumentation-dbapi==0.66b0",
    "opentelemetry-instrumentation-grpc==0.66b0",
    "opentelemetry-instrumentation-logging==0.66b0",
    "opentelemetry-instrumentation-redis==0.66b0",
    "opentelemetry-instrumentation-psycopg2==0.66b0",
    "opentelemetry-instrumentation-psycopg==0.66b0",
    "opentelemetry-instrumentation-requests==0.66b0",
    "opentelemetry-instrumentation-wsgi==0.66b0",
    "opentelemetry-proto==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-semantic-conventions==0.66b0",
    "opentelemetry-util-http==0.66b0",
    "Brotli==1.2.0",
    "loguru==0.7.3",
    "django-cachalot==2.9.1",
    "celery-singleton==0.3.1",
    "prosemirror==0.6.1",
    "rich==15.0.0",
    "tzdata==2026.5",
    "typing_extensions>=4.14.1",
    "icalendar==7.3.0",
    "jira2markdown==0.5.1",
    "atlassian-python-api==5.0.5",
    "openpyxl==3.1.5",
    "zipstream-ng==1.9.3",
    # Held: 2.x+ reworks the CTEQuery/CTECompiler internals that
    # database/table/queryset.py subclasses (#24).
    "django-cte==1.3.3",
    "genson==1.4.0",
    "pyotp==2.10.0",
    "qrcode==8.2",
    "opentelemetry-sdk>=1.20.0",
    "netifaces==0.11.0",
    "requests-futures>=1.1.0",
    "xlrd==2.0.2",
    "pyarrow==25.0.1",
]

[project.urls]
Homepage = "https://github.com/carneirofc/baserow"
"Bug Tracker" = "https://github.com/carneirofc/baserow/issues"
Documentation = "https://github.com/carneirofc/baserow"
Support = "https://github.com/carneirofc/baserow/issues"
Changelog = "https://github.com/carneirofc/baserow/blob/develop/changelog.md"

[project.scripts]
baserow = "baserow.manage:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "ruff>=0.8.0",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-env==1.7.1",
    "pytest-asyncio==1.4.0",
    "pytest-ordering==0.6",
    "pytest-mock==3.16.0",
    "pytest-icdiff==0.9",
    "freezegun==1.5.5",
    "responses==0.26.3",
    "watchdog==6.0.0",
    "argh==0.31.3",
    "pyinstrument==5.1.3",
    "pyfakefs==6.2.0",
    "pytest-xdist==3.8.0",
    "django-silk==5.6.0",
    "django-extensions==4.1",
    "snoop==0.6.1",
    "openapi-spec-validator==0.9.0",
    "pytest-html==4.2.0",
    "coverage==7.16.2",
    "pytest-split==0.11.0",
    "pytest-unordered==0.8.0",
    "debugpy==1.8.22",
    "backports.cached-property==1.0.2",
    "graphviz==0.21",
    "pytest-cov==7.1.0",
    "django-stubs==6.1.1",
    "django-stubs-ext==6.1.1",
    # django-stubs 6.x split the DRF mypy plugin out of the package; mypy.ini
    # loads mypy_drf_plugin, which now lives here.
    "djangorestframework-stubs==3.18.1",
    "mypy==2.4.0",
    "mypy-extensions==1.1.0",
    "ipython",
    "fakeredis[lua]==2.39.0",
    "pytest-retry==1.7.0",
    "pytest-testmon==2.2.0",
    "ipdb",
    "build",
    "rust-just>=1.57.0",
    "syrupy==6.1.1",
    "moto[s3]==5.2.3",
]
changelog = [
    "typer==0.27.2",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "src/baserow/version.py"
pattern = "VERSION = \"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
packages = ["src/baserow"]

[tool.ruff]
target-version = "py314"
line-length = 88
exclude = ["**/migrations/**", "**/generated/**"]
# Apply `exclude` even when files are passed explicitly on the command line,
# so per-file invocations (e.g. via pre-commit) skip migrations/generated code.
force-exclude = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "S",      # flake8-bandit (security)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E731",   # lambda assignment (common pattern)
    "S101",   # use of assert (fine in tests)
    "S105",   # possible hardcoded password (false positives on variable names)
    "S110",   # try-except-pass (intentional in some cases)
    "S112",   # try-except-continue (intentional in some cases)
    "S311",   # pseudo-random generators (not for crypto)
    "S611",   # use of exec (intentional in some places)
    "F541",   # f-string without placeholders (common pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "S105", "S106", "S608", "F841"]
"../**/tests/**/*" = ["S101", "S105", "S106", "S608", "F841"]
"src/baserow/test_utils/**/*" = ["S101", "S105", "S106", "S608", "F841"]
"src/baserow/config/settings/local.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["baserow"]
section-order = ["future", "standard-library", "django", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
django = ["django"]

[tool.uv]
package = true
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "baserow.config.settings.test"
python_files = ["test_*.py", "*_test.py"]
pythonpath = [
    "tests",
]
