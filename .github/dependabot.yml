version: 2
updates:
  # =============================================================================
  # npm ecosystems
  # =============================================================================
  # Every directory with a yarn.lock is monitored: the CVE gate
  # (`just audit deps`) scans all of them, so all of them need update PRs.

  - package-ecosystem: "npm"
    directory: "/web-frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/e2e-tests"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/backend/email_compiler"
    schedule:
      interval: "weekly"

  # =============================================================================
  # uv (Python) ecosystem
  # =============================================================================
  # backend/pyproject.toml declares all Python dependencies, resolved in
  # backend/uv.lock.

  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"

  # =============================================================================
  # Base images and CI actions
  # =============================================================================

  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/web-frontend"
      - "/deploy/all-in-one"
      - "/deploy/caddy"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
